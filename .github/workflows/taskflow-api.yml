name: TaskFlow API CI

on:
  push:
    branches:
      - main
    paths:
      - "taskflow-api/**"
      - ".github/workflows/taskflow-api.yml"
  pull_request:
    branches:
      - main
    # paths:
    #   - "taskflow-api/**"
    #   - ".github/workflows/taskflow-api.yml"

permissions:
  contents: read

# concurrency:
#   group: taskflow-api-${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  validate:
    name: Build and test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskflow-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test -- --runInBand

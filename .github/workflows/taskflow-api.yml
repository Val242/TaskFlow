name: TaskFlow API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "taskflow-api/**"
      - ".github/workflows/taskflow-api.yml"
  pull_request:
    branches:
      - main
    paths:
      - "taskflow-api/**"
      - ".github/workflows/taskflow-api.yml"

permissions:
  contents: read

concurrency:
  group: taskflow-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint, test, build, and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-api
    outputs:
      prisma-version: ${{ steps.package.outputs.prisma-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskflow-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Package release
        id: package
        shell: bash
        run: |
          archive="$RUNNER_TEMP/taskflow-api-${GITHUB_SHA}.tar.gz"
          tar -czf "$archive" \
            -C "$GITHUB_WORKSPACE/taskflow-api" \
            dist package.json package-lock.json prisma prisma.config.ts
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "prisma-version=$(node -p "require('./package-lock.json').packages['node_modules/prisma'].version")" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-api-${{ github.sha }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  security:
    name: Secret and dependency scans
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskflow-api/package-lock.json

      - name: Install dependencies
        working-directory: taskflow-api
        run: npm ci

      - name: Audit production dependencies
        working-directory: taskflow-api
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs:
      - build
      - security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
    steps:
      - name: Validate deployment settings
        shell: bash
        run: |
          for name in AWS_REGION EC2_INSTANCE_ID ARTIFACT_BUCKET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the $name repository variable before deploying."
              exit 1
            fi
          done
          if [[ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]]; then
            echo "::error::Set the AWS_DEPLOY_ROLE_ARN repository secret before deploying."
            exit 1
          fi

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: taskflow-api-${{ github.sha }}
          path: release

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload release to S3
        shell: bash
        run: |
          archive="release/taskflow-api-${GITHUB_SHA}.tar.gz"
          test -f "$archive"
          aws s3 cp "$archive" \
            "s3://${ARTIFACT_BUCKET}/taskflow-api/${GITHUB_SHA}.tar.gz" \
            --sse AES256

      - name: Deploy through Systems Manager
        id: ssm
        shell: bash
        env:
          PRISMA_VERSION: ${{ needs.build.outputs.prisma-version }}
        run: |
          parameters=$(jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg bucket "$ARTIFACT_BUCKET" \
            --arg prisma "$PRISMA_VERSION" \
            '{
              commands: [(
                "set -eu\n" +
                "set -x\n" +
                "APP_ROOT=/opt/taskflow-api\n" +
                "ENV_FILE=/etc/taskflow-api/taskflow-api.env\n" +
                "test -f \"$ENV_FILE\" || { echo \"Missing $ENV_FILE\"; exit 1; }\n" +
                "command -v aws >/dev/null\n" +
                "command -v node >/dev/null\n" +
                "command -v npm >/dev/null\n" +
                "release_dir=\"$APP_ROOT/releases/" + $sha + "\"\n" +
                "mkdir -p \"$release_dir\"\n" +
                "aws s3 cp \"s3://" + $bucket + "/taskflow-api/" + $sha + ".tar.gz\" /tmp/taskflow-api-" + $sha + ".tar.gz\n" +
                "tar -xzf /tmp/taskflow-api-" + $sha + ".tar.gz -C \"$release_dir\"\n" +
               "ln -sfnT \"$ENV_FILE\" \"$release_dir/.env\"\n" +
                "cd \"$release_dir\"\n" +
                "echo \"Installing application dependencies...\"\n" +
                "npm ci --omit=dev\n" +
                "echo \"Installing Prisma CLI...\"\n" +
                "npm install --no-save --package-lock=false --omit=dev \"prisma@" + $prisma + "\" dotenv\n" +
                "echo \"Generating Prisma client...\"\n" +
                "npx prisma generate\n" +
                "echo \"Applying database migrations...\"\n" +
                "npx prisma migrate deploy\n" +
                "previous_release=$(readlink -f \"$APP_ROOT/current\" || true)\n" +
                "ln -sfnT \"$release_dir\" \"$APP_ROOT/current\"\n" +
                "if ! systemctl restart taskflow-api; then\n" +
                "  if [ -n \"$previous_release\" ]; then ln -sfnT \"$previous_release\" \"$APP_ROOT/current\"; systemctl restart taskflow-api || true; fi\n" +
                "  exit 1\n" +
                "fi\n" +
                "ready=0\n" +
                "for attempt in $(seq 1 30); do\n" +
                "  if curl --fail --silent http://127.0.0.1:3000/health/ready; then ready=1; break; fi\n" +
                "  sleep 2\n" +
                "done\n" +
                "if [ \"$ready\" -ne 1 ]; then\n" +
                "  journalctl -u taskflow-api -n 100 --no-pager || true\n" +
                "  if [ -n \"$previous_release\" ]; then ln -sfnT \"$previous_release\" \"$APP_ROOT/current\"; systemctl restart taskflow-api || true; fi\n" +
                "  exit 1\n" +
                "fi\n" +
                "echo \"Deployment " + $sha + " is healthy.\"\n"
              )]
            }')

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy TaskFlow API ${GITHUB_SHA}" \
            --timeout-seconds 900 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          echo "command-id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment and report failures
        shell: bash
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command-id }}
        run: |
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "SSM deployment status: $STATUS"

            case "$STATUS" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "SSM deployment did not finish within 15 minutes."
          exit 1
